name: Rust

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: amd64_linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: arm64_linux
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: amd64_windows
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: arm64_windows
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: arm64_darwin
    env:
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools protobuf-compiler

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install protoc --version=36.1.0 --yes --no-progress

      - name: Install Rust stable and target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Check toolchain and protoc
        run: |
          rustc -vV
          protoc --version

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/ocipack-${RELEASE_VERSION}-${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" ocipack

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/ocipack.exe" -DestinationPath "dist/ocipack-$($env:RELEASE_VERSION)-${{ matrix.asset }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocipack-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ocipack-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum ocipack-* > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
